 class="gallery-card__intro" hidden><p class="art-modal__meta">欧仁·德拉克洛瓦 · 约 1843</p><p>取材自拜伦 1813 年的东方叙事诗《阿拜多斯的新娘》：塞利姆与祖蕾卡这对恋人私奔到海边岩洞，画定格在他们持刀戒备、回望来路的一瞬，远处海面平静，洞内的戏剧性却被拉到最满。</p><p>岩壁的阴影与海天的亮色一压一亮，人物的红、金、蓝在暗部里烧起来，是浪漫主义&quot;以色写情&quot;的典型手法。</p></div></figure></div></div></section></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>
