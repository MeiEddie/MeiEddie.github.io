name: Deploy VitePress Blog
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动重跑

permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npx vitepress build docs

      - name: Copy static assets into build output
        run: |
          # VitePress 构建时不会自动把 docs/ 下的静态资源（头像、PDF、图片）
          # 复制到构建产物，需要手动复制，否则线上访问会 404
          cp docs/avatar.jpg docs/.vitepress/dist/avatar.jpg
          cp -r docs/assets/. docs/.vitepress/dist/assets/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/.vitepress/dist